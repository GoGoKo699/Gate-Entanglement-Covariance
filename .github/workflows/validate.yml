name: Validate research repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.txt
      - name: Check maintained navigation
        run: python scripts/check_repository.py
      - name: Check maintained Markdown math
        run: python scripts/check_markdown_math.py --self-test
      - name: Verify reference integrity and reproduce deterministic calculations
        run: python scripts/reproduce.py
