name: Validate research repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install recorded dependencies
        run: python -m pip install -r requirements.txt
      - name: Check maintained navigation
        run: python scripts/check_repository.py
      - name: Verify research and regenerate reader outputs
        run: python scripts/reproduce.py
      - name: Verify preserved legacy tree
        run: test "$(git rev-parse HEAD:legacy/subset-development)" = ffb13b5f01c8c8ad18c80b521feefd3383a34e34
